[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cctv-analytics-worker"
version = "0.1.0"
description = "Analytics worker for CCTV dwell-time and posture detection"
requires-python = ">=3.12"
dependencies = [
  "ultralytics>=8.3.0,<9.0.0",
  "opencv-python-headless>=4.10.0,<5.0.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0,<9.0.0", "pytest-asyncio>=0.25.0,<1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
